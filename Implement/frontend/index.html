<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>LLMWorld 模拟世界可视化</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 16px; background: #f5f6f8; color: #222; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; background: #fff; padding: 10px 14px; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .toolbar label { font-size: 13px; color: #555; }
  select { padding: 4px 8px; border-radius: 4px; border: 1px solid #bbb; font-size: 13px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .card { background: #fff; border-radius: 6px; padding: 10px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.12); min-width: 120px; }
  .card .v { font-size: 22px; font-weight: 600; }
  .card .k { font-size: 12px; color: #888; }
  .panel { background: #fff; border-radius: 6px; padding: 12px 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .panel h3 { margin: 0 0 8px; font-size: 15px; border-left: 4px solid #4a7; padding-left: 8px; }
  canvas { width: 100%; height: 260px; border: 1px solid #eee; background: #fafbfc; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #e3e5e8; padding: 5px 8px; text-align: left; }
  th { background: #f0f2f5; }
  .err { color: #c33; font-size: 13px; }
  .news { font-size: 13px; line-height: 1.6; }
  .news b { color: #456; }
</style>
</head>
<body>
<h1>LLMWorld 模拟世界可视化</h1>

<div class="toolbar">
  <label>世界 <select id="selWorld"></select></label>
  <label>日期 <select id="selDate"></select></label>
  <button onclick="refresh()">刷新</button>
  <span id="status" class="err"></span>
</div>

<div class="panel">
  <h3>场景选择（可多选，同图叠加对比）</h3>
  <div id="scenarioList" style="font-size:13px;"></div>
</div>

<div class="cards" id="cards"></div>

<div class="panel">
  <h3>人口级负荷曲线（1440 分钟 → 小时均值，多场景叠加）</h3>
  <canvas id="curve" width="1100" height="260"></canvas>
  <div id="curveInfo" style="font-size:12px;color:#666;margin-top:6px;"></div>
</div>

<div class="panel">
  <h3>多日能量轨迹（各场景每日总用电）</h3>
  <canvas id="trend" width="1100" height="200"></canvas>
  <div id="trendInfo" style="font-size:12px;color:#666;margin-top:6px;"></div>
</div>

<div class="panel">
  <h3>逐户用电明细</h3>
  <table id="houseTable"><thead><tr><th>家庭</th><th>用电(kWh)</th><th>峰值(W)</th><th>峰值时刻</th></tr></thead><tbody></tbody></table>
</div>

<div class="panel">
  <h3>场景对比矩阵（vs 基线变化%）</h3>
  <div id="matrix"></div>
</div>

<div class="panel">
  <h3>人口归因分析（计划25：家庭类型/节能意识/成员数/人格 → 用电）</h3>
  <div id="populationAnalysis">（加载中…）</div>
</div>

<div class="panel">
  <h3>上帝剧本（events.json 新闻）</h3>
  <div style="margin-bottom:8px;font-size:13px;">
    日期 <input id="evDate" value="2026-04-22" style="width:110px"> 
    标题 <input id="evTitle" placeholder="事件标题" style="width:200px">
    内容 <input id="evContent" placeholder="事件内容" style="width:360px">
    来源 <input id="evSource" value="上帝" style="width:90px">
    <button onclick="godInject()">注入事件</button>
    <span id="godStatus" style="color:#4a7;font-size:12px;"></span>
  </div>
  <div id="news" class="news">（加载中…）</div>
</div>

<script>
let worldsData = [];

const COLORS = ["#2a7", "#c33", "#36c", "#c90", "#a2a", "#0aa", "#c63"];

async function api(path) {
  const r = await fetch(path);
  return r.json();
}

async function init() {
  worldsData = await api("/api/worlds");
  const sel = document.getElementById("selWorld");
  sel.innerHTML = worldsData.map(w => `<option value="${w.id}">${w.id}（${w.households.length}户）</option>`).join("");
  sel.onchange = () => { loadScenarios(); };
  await loadScenarios();
  refresh();
}

async function loadScenarios() {
  const worldId = document.getElementById("selWorld").value;
  const world = worldsData.find(w => w.id === worldId);
  const box = document.getElementById("scenarioList");
  const dateSel = document.getElementById("selDate");
  if (!world || !world.scenarios.length) {
    box.innerHTML = "（无模拟结果）";
    dateSel.innerHTML = "";
    return;
  }
  // 场景多选框（默认全选）
  box.innerHTML = world.scenarios.map((s, i) =>
    `<label style="margin-right:10px;"><input type="checkbox" class="scChk" value="${s.name}" ${i < 5 ? "checked" : ""}> ${s.name}</label>`).join("");
  // 日期下拉：取第一个场景的日期
  const dates = world.scenarios[0].dates;
  dateSel.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join("");
  document.querySelectorAll(".scChk").forEach(c => c.onchange = refresh);
  dateSel.onchange = refresh;
}

function selectedScenarios() {
  return [...document.querySelectorAll(".scChk:checked")].map(c => c.value);
}

function hourCurve(watts) {
  const hourly = [];
  for (let h = 0; h < 24; h++) {
    const seg = watts.slice(h * 60, (h + 1) * 60);
    hourly.push(seg.reduce((a, b) => a + b, 0) / seg.length);
  }
  return hourly;
}

async function refresh() {
  const worldId = document.getElementById("selWorld").value;
  const date = document.getElementById("selDate").value;
  const scenarios = selectedScenarios();
  const st = document.getElementById("status");
  if (!worldId || !date || !scenarios.length) { st.textContent = "请选择世界/日期/至少一个场景"; return; }
  st.textContent = "加载中…";
  try {
    const profiles = [];
    for (const s of scenarios) {
      const p = await api(`/api/worlds/${worldId}/profile/${s}/${date}`);
      if (!p.error) profiles.push({scenario: s, data: p});
    }
    if (!profiles.length) throw new Error("所选场景无数据");
    renderCards(profiles[0].data);
    renderCurve(profiles);
    renderHouses(profiles[0].data);
    renderTrend(worldId);
    await renderMatrix(worldId);
    await renderAnalysis(worldId);
    await renderNews(worldId);
    st.textContent = "";
  } catch (e) {
    st.textContent = "错误: " + e.message;
  }
}

function renderCards(p) {
  const items = [
    ["总用电(kWh)", p.total_energy_kwh],
    ["户均(kWh)", p.mean_household_kwh],
    ["峰值(W)", p.peak_watts],
    ["峰值时刻", p.peak_time],
    ["家庭数", p.households],
  ];
  // 环境信息（计划23）：第一户的环境作为代表展示
  const envMap = p.environment || {};
  const firstEnv = Object.values(envMap)[0];
  if (firstEnv) {
    items.push([`天气(${firstEnv.mode || "?"})`, `${firstEnv.condition} ${firstEnv.temperature}℃`]);
  }
  document.getElementById("cards").innerHTML = items.map(([k, v]) =>
    `<div class="card"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");
}

function renderCurve(profiles) {
  const cv = document.getElementById("curve");
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, padL = 50, padB = 26, padT = 10;
  ctx.clearRect(0, 0, W, H);
  if (!profiles.length) return;
  const curves = profiles.map(p => ({name: p.scenario, hourly: hourCurve(p.data.load_profile_watts)}));
  const max = Math.max(...curves.flatMap(c => c.hourly)) * 1.1 || 1;
  const x = h => padL + (h / 23) * (W - padL - 10);
  const y = v => H - padB - (v / max) * (H - padT - padB);
  ctx.strokeStyle = "#eee";
  ctx.fillStyle = "#666";
  ctx.font = "11px sans-serif";
  for (let h = 0; h < 24; h += 2) {
    ctx.beginPath(); ctx.moveTo(x(h), padT); ctx.lineTo(x(h), H - padB); ctx.stroke();
    ctx.fillText(h + ":00", x(h) - 10, H - 10);
  }
  for (let g = 0; g <= 4; g++) {
    const v = max * g / 4;
    ctx.beginPath(); ctx.moveTo(padL, y(v)); ctx.lineTo(W - 10, y(v)); ctx.stroke();
    ctx.fillText(Math.round(v), 6, y(v) + 4);
  }
  curves.forEach((c, i) => {
    ctx.strokeStyle = COLORS[i % COLORS.length];
    ctx.lineWidth = 2;
    ctx.beginPath();
    c.hourly.forEach((v, h) => h === 0 ? ctx.moveTo(x(h), y(v)) : ctx.lineTo(x(h), y(v)));
    ctx.stroke();
    const pi = c.hourly.indexOf(Math.max(...c.hourly));
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.beginPath(); ctx.arc(x(pi), y(c.hourly[pi]), 4, 0, 7); ctx.fill();
  });
  document.getElementById("curveInfo").innerHTML =
    curves.map((c, i) => `<span style="color:${COLORS[i % COLORS.length]};margin-right:14px;">■ ${c.name}</span>`).join("")
    + "（小时均值曲线，点=各场景峰值时刻）";
}

function renderHouses(p) {
  const tb = document.querySelector("#houseTable tbody");
  tb.innerHTML = (p.per_house || []).map(h =>
    `<tr><td>${h.house_id}</td><td>${h.total_energy_kwh}</td><td>${h.peak_watts}</td><td>${h.peak_time}</td></tr>`).join("");
}

async function renderTrend(worldId) {
  const world = worldsData.find(w => w.id === worldId);
  const cv = document.getElementById("trend");
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, padL = 50, padB = 26, padT = 10;
  ctx.clearRect(0, 0, W, H);
  if (!world || !world.scenarios.length) return;
  // 收集所有日期（去重排序）
  const dates = [...new Set(world.scenarios.flatMap(s => s.dates))].sort();
  if (!dates.length) return;
  // 各场景各日期总用电
  const rows = [];
  for (const s of world.scenarios) {
    for (const d of s.dates) {
      const p = await api(`/api/worlds/${worldId}/profile/${s.name}/${d}`);
      if (!p.error) rows.push({scenario: s.name, date: d, kwh: p.total_energy_kwh});
    }
  }
  if (!rows.length) return;
  const maxKwh = Math.max(...rows.map(r => r.kwh)) * 1.1 || 1;
  const bw = 12, gap = 4;
  const x = i => padL + i * (bw + gap) + bw;
  const y = v => H - padB - (v / maxKwh) * (H - padT - padB);
  // 每个日期一组柱
  const colorOf = s => COLORS[world.scenarios.findIndex(w2 => w2.name === s) % COLORS.length];
  dates.forEach((d, di) => {
    const ds = rows.filter(r => r.date === d);
    ds.forEach((r, ri) => {
      const xx = padL + di * (bw + gap) * ds.length + ri * (bw + gap) + gap;
      ctx.fillStyle = colorOf(r.scenario);
      ctx.fillRect(xx, y(r.kwh), bw, H - padB - y(r.kwh));
    });
    ctx.fillStyle = "#666";
    ctx.font = "10px sans-serif";
    ctx.fillText(d.slice(5), padL + di * (bw + gap) * ds.length + 4, H - 10);
  });
  for (let g = 0; g <= 4; g++) {
    const v = maxKwh * g / 4;
    ctx.strokeStyle = "#eee";
    ctx.beginPath(); ctx.moveTo(padL, y(v)); ctx.lineTo(W - 10, y(v)); ctx.stroke();
    ctx.fillText(Math.round(v), 6, y(v) + 4);
  }
  const legend = [...new Set(rows.map(r => r.scenario))]
    .map((s, i) => `<span style="color:${colorOf(s)};margin-right:10px;">■ ${s}</span>`).join("");
  document.getElementById("trendInfo").innerHTML = legend;
}

async function renderMatrix(worldId) {
  const m = await api(`/api/worlds/${worldId}/matrix`);
  const div = document.getElementById("matrix");
  if (!m || m.error || !m.scenarios) { div.innerHTML = "<span class='err'>（无矩阵，先跑 compare_policies --all）</span>"; return; }
  const keys = Object.keys(m.scenarios[0]);
  const head = keys.map(k => `<th>${k}</th>`).join("");
  const rows = m.scenarios.map(s => `<tr>${keys.map(k => `<td>${s[k] ?? ""}</td>`).join("")}</tr>`).join("");
  div.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}

async function renderAnalysis(worldId) {
  const div = document.getElementById("populationAnalysis");
  const scenario = selectedScenarios()[0] || "baseline";
  const a = await api(`/api/worlds/${worldId}/analysis/${scenario}`);
  if (!a || a.error) { div.innerHTML = "<span class='err'>（无分析，先跑 analyze_population）</span>"; return; }
  const table = (title, obj) => {
    const rows = Object.entries(obj || {}).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
    return `<b>${title}</b><table style="margin:6px 0 14px;"><tbody>${rows}</tbody></table>`;
  };
  div.innerHTML =
    table("家庭类型 → 户均kWh", a.by_type) +
    table("节能意识 → 户均kWh", a.by_awareness) +
    table("成员数 → 户均kWh", a.by_members_count) +
    table("Big Five × 户用电相关性", a.big_five_corr_with_kwh) +
    `<div style="font-size:12px;color:#666;">成员数×用电相关：${a.members_kwh_corr}</div>`;
}

async function renderNews(worldId) {
  const e = await api(`/api/worlds/${worldId}/events`);
  const div = document.getElementById("news");
  const evs = e.events || [];
  if (!evs.length) { div.innerHTML = "（无剧本事件）"; return; }
  div.innerHTML = evs.map(n =>
    `<div><b>[${n.date} ${n.time}]（${n.source || ""}）${n.title}</b><br>${n.content}</div><br>`).join("");
}

async function godInject() {
  const worldId = document.getElementById("selWorld").value;
  const st = document.getElementById("godStatus");
  if (!worldId) { st.textContent = "请先选择世界"; return; }
  const body = {
    date: document.getElementById("evDate").value.trim(),
    title: document.getElementById("evTitle").value.trim(),
    content: document.getElementById("evContent").value.trim(),
    source: document.getElementById("evSource").value.trim() || "上帝",
  };
  if (!body.date || !body.title || !body.content) { st.textContent = "日期/标题/内容必填"; return; }
  try {
    const r = await fetch(`/api/worlds/${worldId}/events`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    const res = await r.json();
    if (res.error) throw new Error(res.error);
    st.textContent = "已注入：" + body.title;
    document.getElementById("evTitle").value = "";
    document.getElementById("evContent").value = "";
    await renderNews(worldId);
  } catch (e) {
    st.textContent = "失败: " + e.message;
  }
}

// 自动刷新：每 10 秒重新拉取当前视图（世界变动实时可见）
setInterval(() => {
  const sel = document.getElementById("selWorld");
  if (sel && sel.value) refresh();
}, 10000);

init();
</script>
</body>
</html>
